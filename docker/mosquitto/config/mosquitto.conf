# =====================================================================
#  Mosquitto MQTT Broker — yapılandırma
# ---------------------------------------------------------------------
#  MVP / demo ayarı: anonim bağlantıya izin verilir.
#  ÜRETİMDE: allow_anonymous false yapıp kullanıcı/şifre (password_file)
#  veya TLS eklemeniz önerilir.
# =====================================================================

# 1883 portunu tüm arayüzlerde dinle
listener 1883
allow_anonymous true

# Kalıcılık: broker yeniden başlasa da abonelik/mesaj durumu korunur
persistence true
persistence_location /mosquitto/data/

# Log ayarları
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
